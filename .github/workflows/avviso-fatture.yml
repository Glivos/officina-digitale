name: Avviso fatture

# Quando una proposta di modifica tocca il calcolo delle fatture o i suoi test,
# questo workflow lascia un commento nella pull request per avvisare l'amministrazione.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/fatture.js"
      - "test/**"

permissions:
  pull-requests: write

jobs:
  avviso:
    name: Avvisa chi si occupa di amministrazione
    runs-on: ubuntu-latest
    steps:
      - name: Scrivi il commento nella pull request
        uses: actions/github-script@v7
        with:
          script: |
            const avviso = "Questa modifica tocca il calcolo delle fatture, va avvisato chi si occupa di amministrazione prima del merge.";
            const commenti = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            if (commenti.some((commento) => commento.body.includes(avviso))) {
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: avviso,
            });
